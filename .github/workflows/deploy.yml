name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: |
          npx playwright install chromium
          npm run test -- --watch=false --browser.enabled=true --browser.name=chromium --browser.headless=true

      - name: Build
        run: npm run build -- --base-href / --configuration production

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/yojana-green-ventures/browser
          branch: gh-pages
          cname: yojanagreen.com